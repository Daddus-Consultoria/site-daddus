# Coleta de metadados da Biblioteca Daddus.
#
# Roda aqui, e nao na Vercel, porque a coleta de um repositorio inteiro leva
# minutos e nao cabe no tempo de uma funcao serverless. O cron dispara a coleta
# incremental por periodicidade; o disparo manual permite recoletar uma fonte
# ou refazer tudo do zero.
name: Biblioteca — coleta

on:
  schedule:
    # Diaria, 06:10 UTC (03:10 em Brasilia) — fora do horario de uso do site.
    - cron: "10 6 * * *"
    # Semanal, segunda-feira.
    - cron: "40 6 * * 1"
    # Mensal, dia 1.
    - cron: "10 7 1 * *"
  workflow_dispatch:
    inputs:
      fonte:
        description: "Slug da fonte (vazio = todas as ativas)"
        required: false
        type: string
      full:
        description: "Ignorar o ponto de parada e recoletar tudo"
        required: false
        default: false
        type: boolean

concurrency:
  # Duas coletas simultaneas disputariam as mesmas linhas e o mesmo ponto de
  # parada da fonte.
  group: biblioteca-coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - run: yarn install --frozen-lockfile

      # Sem o secret, os passos seguintes falhariam com erro de conexao — que
      # nao aponta para a causa. Melhor parar aqui dizendo o que falta.
      - name: Conferir o secret DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::O secret DATABASE_URL nao esta configurado neste repositorio."
            echo "Settings -> Secrets and variables -> Actions -> New repository secret."
            echo "No Railway, use a DATABASE_PUBLIC_URL (termina em .proxy.rlwy.net com porta)."
            exit 1
          fi
          case "$DATABASE_URL" in
            *railway.internal*)
              echo "::error::Esta e a URL interna do Railway e nao funciona fora dele."
              echo "Use a DATABASE_PUBLIC_URL, que termina em .proxy.rlwy.net com uma porta."
              exit 1
              ;;
          esac
          echo "secret presente."

      - name: Aplicar migrations pendentes
        run: yarn db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Definir periodicidade a partir do cron
        id: periodicidade
        run: |
          case "${{ github.event.schedule }}" in
            "10 6 * * *")   echo "frequencia=diaria"  >> "$GITHUB_OUTPUT" ;;
            "40 6 * * 1")   echo "frequencia=semanal" >> "$GITHUB_OUTPUT" ;;
            "10 7 1 * *")   echo "frequencia=mensal"  >> "$GITHUB_OUTPUT" ;;
            *)              echo "frequencia="        >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Coletar
        # As entradas do disparo manual chegam por variavel de ambiente, e nao
        # interpoladas no script: texto vindo de fora do repositorio nunca deve
        # virar comando de shell.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FONTE: ${{ inputs.fonte }}
          FULL: ${{ inputs.full }}
          FREQUENCIA: ${{ steps.periodicidade.outputs.frequencia }}
        run: |
          set -euo pipefail

          ARGS=()
          if [ -n "${FONTE:-}" ]; then
            # So aceita slug: letras minusculas, numeros e hifen.
            case "$FONTE" in
              *[!a-z0-9-]*)
                echo "::error::Fonte invalida: use o slug da fonte (ex.: ipea, fgv, ufmg, ufpr)."
                exit 1
                ;;
            esac
            ARGS+=("$FONTE")
          elif [ -n "${FREQUENCIA:-}" ]; then
            ARGS+=("--frequency=${FREQUENCIA}")
          fi

          if [ "${FULL:-false}" = "true" ]; then
            ARGS+=("--full")
          fi

          echo "yarn harvest ${ARGS[*]-}"
          yarn harvest "${ARGS[@]}"
